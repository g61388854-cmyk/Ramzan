# Специализированные профили. Профиль не создаёт новых видов процессуальных
# полномочий: он дополняет существующие виды документов подсказками, перечнями
# вопросов и предупреждениями. Подсказки носят методический характер и не
# являются нормативными требованиями.
specializations:
  - code: economic
    title: "Экономические преступления"
    applies_to: [expertise_order, information_request, property_arrest_petition]
    suggestions:
      expertise_type: ["судебно-бухгалтерская", "финансово-экономическая", "налоговая"]
    warnings:
      - "При истребовании сведений, составляющих банковскую или налоговую тайну, соблюдается специальный порядок, установленный федеральным законом."
  - code: person_harm
    title: "Преступления против личности"
    applies_to: [expertise_order, examination_resolution, corpse_inspection]
    suggestions:
      expertise_type: ["судебно-медицинская", "судебно-психиатрическая", "комплексная психолого-психиатрическая"]
      questions: ["Какие телесные повреждения имеются у потерпевшего, каковы их локализация, механизм и давность образования?", "Какова степень тяжести вреда, причинённого здоровью потерпевшего?"]
    warnings:
      - "Назначение судебной экспертизы обязательно для установления характера и степени вреда, причинённого здоровью (ст. 196 УПК РФ)."
  - code: property_crimes
    title: "Преступления против собственности"
    applies_to: [expertise_order, victim_recognition, material_evidence]
    suggestions:
      expertise_type: ["товароведческая", "оценочная", "трасологическая"]
      questions: ["Какова рыночная стоимость представленного имущества с учётом износа на дату совершения преступления?"]
    warnings: []
  - code: cyber
    title: "Преступления в сфере компьютерной информации"
    applies_to: [object_inspection, search_protocol, expertise_order, information_request]
    suggestions:
      expertise_type: ["компьютерная (компьютерно-техническая)"]
      technical_means: ["Специалист, аппаратное средство блокировки записи, фотофиксация"]
    warnings:
      - "Изъятие электронных носителей информации при производстве следственных действий осуществляется с участием специалиста (ст. 164.1 УПК РФ)."
      - "Информация о соединениях между абонентами получается только на основании судебного решения (ст. 186.1 УПК РФ)."
  - code: drugs
    title: "Преступления, связанные с наркотическими средствами"
    applies_to: [expertise_order, search_protocol, personal_search_protocol, material_evidence]
    suggestions:
      expertise_type: ["физико-химическая (судебно-химическая)"]
      questions: ["Является ли представленное вещество наркотическим средством, психотропным веществом или их аналогом? Если является, то каким именно и какова его масса?"]
    warnings:
      - "Значительный, крупный и особо крупный размеры наркотических средств определяются постановлением Правительства РФ от 01.10.2012 № 1002; проверьте действующую редакцию."
  - code: migration
    title: "Преступления в сфере незаконной миграции"
    applies_to: [interpreter_appointment, interrogation_suspect, detention_relatives_notice, information_request]
    suggestions: {}
    warnings:
      - "Лицо, не владеющее языком судопроизводства, вправе пользоваться помощью переводчика бесплатно (ст. 18 УПК РФ)."
      - "О задержании иностранного гражданина уведомляется посольство (консульство) соответствующего государства (ст. 96 УПК РФ)."
  - code: group_crimes
    title: "Групповые преступления"
    applies_to: [joinder, separation, confrontation, investigative_group]
    suggestions: {}
    warnings:
      - "Проверьте наличие оснований для соединения (ст. 153 УПК РФ) либо выделения (ст. 154 УПК РФ) уголовных дел в отношении соучастников."
  - code: digital_payments
    title: "Преступления с использованием электронных платежей и цифровых активов"
    applies_to: [information_request, property_arrest_petition, court_action_petition]
    suggestions: {}
    warnings:
      - "Сведения об операциях и счетах, составляющие банковскую тайну, истребуются в порядке ст. 26 Федерального закона «О банках и банковской деятельности»."
      - "Наложение ареста на денежные средства на счетах и во вкладах производится по судебному решению (ст. 115, 165 УПК РФ)."
  - code: maritime
    title: "Преступления, совершённые на морских судах"
    applies_to: [scene_inspection, acceptance, interrogation_witness]
    suggestions: {}
    warnings:
      - "Капитаны морских и речных судов, находящихся в дальнем плавании, являются органами дознания с ограниченными полномочиями (ст. 40 УПК РФ); проверьте поступление материалов неотложных следственных действий и их оформление."
  - code: remote_arctic
    title: "Расследование в удалённых и арктических районах"
    applies_to: [scene_inspection, acceptance, inquiry_body_order]
    suggestions: {}
    warnings:
      - "Начальники геологоразведочных партий и зимовок, удалённых от мест расположения органов дознания, являются органами дознания с ограниченными полномочиями (ст. 40 УПК РФ)."
      - "При необходимости производства действий в другом месте используется порядок ч. 1 ст. 152 УПК РФ."
